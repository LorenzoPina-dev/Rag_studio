[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-studio-backend"
version = "0.1.0"
description = "RAG STUDIO backend - modular, algorithm-agnostic RAG pipeline platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "minio>=7.2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
  "numpy>=1.26.0,<3.0.0",
  "openai>=1.40.0,<3.0.0",
  "sentence-transformers>=3.0.0,<6.0.0",
  "transformers>=4.44.0,<6.0.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "structlog>=24.1.0",
  "cryptography>=42.0.0,<60.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
